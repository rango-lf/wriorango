	<!-- lightbox -->
	<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
		<div class="lightbox-box" onclick="event.stopPropagation()">
			<button type="button" class="lightbox-close" onclick="closeLightbox()">✕</button>
			<img id="lightbox-img" src="" alt="Full size wall image">
			<div class="lightbox-caption" id="lightbox-caption">
				<b id="lightbox-title"></b>
				<span id="lightbox-year"></span>
			</div>
		</div>
	</div>

	<script>
		function openLightbox(src, title, year) {
			const overlay = document.getElementById('lightbox');
			const img = document.getElementById('lightbox-img');
			const caption = document.getElementById('lightbox-caption');
			document.getElementById('lightbox-title').textContent = title || '';
			document.getElementById('lightbox-year').textContent = year || '';
			img.src = src;
			caption.style.display = title ? 'flex' : 'none';
			overlay.classList.add('active');
			document.body.style.overflow = 'hidden';
		}

		function closeLightbox() {
			document.getElementById('lightbox').classList.remove('active');
			document.body.style.overflow = '';
		}

		document.addEventListener('keydown', function (e) {
			if (e.key === 'Escape') closeLightbox();
		});
	</script>
